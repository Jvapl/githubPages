name: Déploiement du blog
 
on:
  push:
    branches: [main]
 
permissions:
  contents: read
  pages: write
  id-token: write
 
# Une seule expédition à la fois (deux push rapprochés ne se télescopent pas)
concurrency:
  group: pages
  cancel-in-progress: false
 
jobs:
  deploy:
    needs: build                             # n'expédie QUE si le build a réussi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4