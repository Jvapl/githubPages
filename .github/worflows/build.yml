name: Déploiement du blog
 
on:
  push:
    branches: [main]
 
permissions:
  contents: read
  pages: write
  id-token: write
 
# Une seule expédition à la fois (deux push rapprochés ne se télescopent pas)
concurrency:
  group: pages
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5     # prépare l'environnement de déploiement Pages
      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: "0.128.0" }
      - run: hugo --minify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public                     # ← _site/ pour Jekyll, dist/ pour Astro
 
  deploy:
    needs: build                             # n'expédie QUE si le build a réussi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4