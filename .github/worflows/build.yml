name: Build du blog

on:
  push:
    branches: [main]
  pull_request: # construire aussi les propositions, avant de fusionner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6 # sinon le runner neuf ne voit pas votre dépôt

      - name: Installer Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0" # version FIXE → résultat reproductible

      - name: Construire le site
        run: hugo --minify # échoue (rouge) si le site ne compile pas
        
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: "0.128.0" }
      - run: hugo --minify
 
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint des articles Markdown
        run: npx markdownlint-cli2 "content/**/*.md"   # ← adaptez le chemin : _posts/ (Jekyll), src/ (Astro)
      - name: Vérifier les liens morts
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "content/**/*.md"        # ← idem, pointez vos articles
          failIfEmpty: false   # un article sans aucun lien ne doit pas faire rougir la porte
